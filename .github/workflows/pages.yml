name: Deploy demo to Pages

# One-time bootstrap: the workflow's GITHUB_TOKEN can publish to a Pages site
# but cannot create one, so on a fresh fork (or after Pages is disabled) enable
# it first — Settings -> Pages -> Source: GitHub Actions, or:
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
# After that this workflow deploys the launch page and deck on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify site references before deploy
        run: node scripts/check_site.mjs
      - name: Stage the launch page and deck
        run: |
          mkdir -p _site
          cp -R site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
