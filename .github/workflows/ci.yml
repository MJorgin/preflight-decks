name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static launch-page references exist
        run: node scripts/check_site.mjs

  dsh-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: DSH bundle manifest stays in sync with SKILL.md
        run: node scripts/check-dsh-manifest.mjs

  verifier-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile verifier
        run: python -m py_compile scripts/verify-deck.py
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Verifier accepts a correct fixed-stage deck
        run: python scripts/verify-deck.py tests/fixtures/minimal-fixed-stage.html
